[package]
name = "speech-to-qso-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
cookie = "0.18"
dotenvy = "0.15.7"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.6.1-dev", features = ["conditional-ui"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
