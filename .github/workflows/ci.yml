name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Vosk silently drops grammar words its model does not know; check them against the shipped models.
  vocabulary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # Keep in sync with web/scripts/fetch-models.sh.
    env:
      VOSK_MODEL_EN: vosk-model-small-en-us-0.15
      VOSK_MODEL_JA: vosk-model-small-ja-0.22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Cache model vocabularies
        id: words-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vosk-words
          key: vocabulary-${{ env.VOSK_MODEL_EN }}-${{ env.VOSK_MODEL_JA }}
      - name: Fetch model vocabularies
        if: steps.words-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vosk-words"
          for model in "$VOSK_MODEL_EN" "$VOSK_MODEL_JA"; do
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$model.zip" "https://alphacephei.com/vosk/models/$model.zip"
            # Small models keep their words only as the symbol table of Gr.fst; the test reads either.
            out="$RUNNER_TEMP/vosk-words/$model"
            unzip -p "$RUNNER_TEMP/$model.zip" '*/graph/words.txt' > "$out" ||
              unzip -p "$RUNNER_TEMP/$model.zip" '*/graph/Gr.fst' > "$out"
            test -s "$out"
          done
      - run: npx vitest run --reporter=default src/lib/dsl/vocabulary.test.ts
        env:
          VOSK_WORDS_EN: ${{ runner.temp }}/vosk-words/${{ env.VOSK_MODEL_EN }}
          VOSK_WORDS_JA: ${{ runner.temp }}/vosk-words/${{ env.VOSK_MODEL_JA }}

  # The built app served by the real server: passkey sign-in (virtual authenticator) and sync.
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:server

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
